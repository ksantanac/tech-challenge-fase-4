# =============================================================================
# Loki — centralização e indexação de TODOS os logs dos contêineres do cluster.
# Modo SingleBinary (1 pod) com armazenamento local: suficiente para o lab.
# Os logs chegam pelo OTel Collector via OTLP (endpoint /otlp do Loki).
# =============================================================================
deploymentMode: SingleBinary

loki:
  auth_enabled: false            # single-tenant
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    allow_structured_metadata: true   # necessário para ingestão OTLP
    volume_enabled: true
    retention_period: 72h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: false                # lab: sem volume EBS...
  extraVolumes:                   # ...então os dados ficam num emptyDir em /var/loki
    - name: data
      emptyDir: {}
  extraVolumeMounts:
    - name: data
      mountPath: /var/loki
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Componentes do modo distribuído / caches: desligados no SingleBinary
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
