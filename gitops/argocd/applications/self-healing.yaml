# Self-Healing (Runbook Automation) — reage aos alertas com rollout restart
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: self-healing
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ksantanac/tech-challenge-fase-4.git
    targetRevision: HEAD
    path: gitops/apps/self-healing
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
