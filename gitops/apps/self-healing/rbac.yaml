# Permissão MÍNIMA para o self-healing: ler e "reiniciar" (patch) deployments
# somente no namespace da aplicação. Nada de delete, nada de outros namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: self-healing
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: self-healing-rollout-restart
  namespace: togglemaster
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: self-healing-rollout-restart
  namespace: togglemaster
subjects:
  - kind: ServiceAccount
    name: self-healing
    namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: self-healing-rollout-restart
