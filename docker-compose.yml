services:
  # --- Bancos de dados locais ---

  postgres-auth:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    volumes:
      - ./auth-service/db:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-flags:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: flags_db
      POSTGRES_USER: flags_user
      POSTGRES_PASSWORD: flags_pass
    volumes:
      - ./flag-service/db:/docker-entrypoint-initdb.d
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flags_user -d flags_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-targeting:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: targeting_db
      POSTGRES_USER: targeting_user
      POSTGRES_PASSWORD: targeting_pass
    volumes:
      - ./targeting-service/db:/docker-entrypoint-initdb.d
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U targeting_user -d targeting_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  # Fila SQS local (ElasticMQ) — a fila é criada no start
  elasticmq:
    image: softwaremill/elasticmq-native:latest
    ports:
      - "9324:9324"

  # Cria a tabela do DynamoDB e a fila SQS locais (roda uma vez e sai)
  aws-local-init:
    image: amazon/aws-cli:latest
    depends_on:
      - dynamodb-local
      - elasticmq
    environment:
      AWS_ACCESS_KEY_ID: "local"
      AWS_SECRET_ACCESS_KEY: "local"
      AWS_DEFAULT_REGION: "us-east-1"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        sleep 5;
        aws dynamodb create-table --endpoint-url http://dynamodb-local:8000
        --table-name ToggleMasterAnalytics --billing-mode PAY_PER_REQUEST
        --attribute-definitions AttributeName=event_id,AttributeType=S
        --key-schema AttributeName=event_id,KeyType=HASH || true;
        aws sqs create-queue --endpoint-url http://elasticmq:9324 --queue-name togglemaster-events || true

  # --- Observabilidade local: OTel Collector + Jaeger (UI: http://localhost:16686) ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./local/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "8889:8889"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:latest
    ports:
      - "16686:16686"

  # --- Microsserviços ---
  # Todos mandam traces e métricas (OTLP) para o otel-collector.

  auth-service:
    build: ./auth-service
    depends_on:
      postgres-auth:
        condition: service_healthy
    environment:
      PORT: "8001"
      DATABASE_URL: "postgres://auth_user:auth_pass@postgres-auth:5432/auth_db"
      MASTER_KEY: "local-master-key-dev"
      OTEL_SERVICE_NAME: "auth-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    ports:
      - "8001:8001"

  flag-service:
    build: ./flag-service
    depends_on:
      postgres-flags:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      PORT: "8002"
      DATABASE_URL: "postgres://flags_user:flags_pass@postgres-flags:5432/flags_db"
      AUTH_SERVICE_URL: "http://auth-service:8001"
      OTEL_SERVICE_NAME: "flag-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SEMCONV_STABILITY_OPT_IN: "http"
    ports:
      - "8002:8002"

  targeting-service:
    build: ./targeting-service
    depends_on:
      postgres-targeting:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      PORT: "8003"
      DATABASE_URL: "postgres://targeting_user:targeting_pass@postgres-targeting:5432/targeting_db"
      AUTH_SERVICE_URL: "http://auth-service:8001"
      OTEL_SERVICE_NAME: "targeting-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SEMCONV_STABILITY_OPT_IN: "http"
    ports:
      - "8003:8003"

  evaluation-service:
    build: ./evaluation-service
    depends_on:
      redis:
        condition: service_healthy
      flag-service:
        condition: service_started
      targeting-service:
        condition: service_started
    environment:
      PORT: "8004"
      REDIS_URL: "redis://redis:6379"
      FLAG_SERVICE_URL: "http://flag-service:8002"
      TARGETING_SERVICE_URL: "http://targeting-service:8003"
      SERVICE_API_KEY: "dev-service-key-local-12345"
      AWS_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "local"
      AWS_SECRET_ACCESS_KEY: "local"
      AWS_SQS_URL: "http://elasticmq:9324/000000000000/togglemaster-events"
      AWS_SQS_ENDPOINT_URL: "http://elasticmq:9324"
      OTEL_SERVICE_NAME: "evaluation-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    ports:
      - "8004:8004"

  analytics-service:
    build: ./analytics-service
    depends_on:
      - dynamodb-local
      - elasticmq
    environment:
      PORT: "8005"
      AWS_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "local"
      AWS_SECRET_ACCESS_KEY: "local"
      AWS_SQS_URL: "http://elasticmq:9324/000000000000/togglemaster-events"
      AWS_SQS_ENDPOINT_URL: "http://elasticmq:9324"
      AWS_DYNAMODB_TABLE: "ToggleMasterAnalytics"
      AWS_DYNAMODB_ENDPOINT_URL: "http://dynamodb-local:8000"
      OTEL_SERVICE_NAME: "analytics-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SEMCONV_STABILITY_OPT_IN: "http"
    ports:
      - "8005:8005"
